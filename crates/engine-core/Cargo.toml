[package]
name = "engine-core"
version = "0.1.0"
edition = "2021"
description = "High-performance streaming JSON conversion, smart flattening, and export engine"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
csv = "1.3"
rust_xlsxwriter = "0.78"
rayon = "1.10"
notify = "6.1"
thiserror = "1.0"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.10"
