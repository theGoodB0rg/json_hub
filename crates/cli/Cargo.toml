[package]
name = "jsonexport-cli"
version = "0.1.0"
edition = "2021"
description = "Headless CLI for high-performance JSON to Excel/CSV streaming conversion"
license = "MIT OR Apache-2.0"

[[bin]]
name = "jsonexport"
path = "src/main.rs"

[dependencies]
engine-core = { path = "../engine-core" }
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.17"
anyhow = "1.0"
