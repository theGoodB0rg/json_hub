[package]
name = "app"
version = "0.1.3"
description = "JsonExport Desktop Pro Native App"
authors = ["JsonExport Team"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Produce JsonExport.exe (not app.exe) so the taskbar + Start Menu + file
# properties all read the brand name. Keeps the Cargo package name "app"
# so existing imports (app_lib::run) stay intact.
[[bin]]
name = "JsonExport"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
engine-core = { path = "../crates/engine-core" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Native Save As dialog (user picks destination) + reveal-in-folder so people
# can actually find exports. M3 remainder — real users complained "I can't
# tell where my file went" because the webview default-downloads silently.
# Pinned to match the npm minors (@tauri-apps/plugin-dialog 2.8.x,
# plugin-opener 2.7.x) — tauri-action refuses to build on a minor mismatch,
# and a bare "2" was pulling the older 2.7.3 / 2.5.5 from crates.io.
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tokio = { version = "1.37", features = ["full"] }
