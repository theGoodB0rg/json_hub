name: Deploy Workers

# Deploys the Cloudflare Workers under worker/ on push to main. Matrix
# over each worker's wrangler config file so adding a new worker is one
# matrix entry plus one paths filter.
#
# Auth: CLOUDFLARE_API_TOKEN secret (scoped Workers Scripts/Routes Edit
# on the Theregalstarlite account + jsonexport.com zone + D1 edit).
# The telemetry job targets the Idowue93 account explicitly via
# CLOUDFLARE_ACCOUNT_ID — it needs the token to also cover that account;
# if its deploy step 401s, mint a token with access to both accounts.
#
# Secrets set directly on a worker (e.g. ADMIN_SECRET on jsonexport-telemetry
# via `wrangler secret put`) survive `wrangler deploy` — deploys here never
# wipe them.

on:
  push:
    branches: ["main"]
    paths:
      - "worker/edge-worker.ts"
      - "worker/wrangler-edge.toml"
      - "worker/license-worker.ts"
      - "worker/wrangler-license.toml"
      - "worker/license-schema.sql"
      - "worker/telemetry-worker.ts"
      - "worker/wrangler.toml"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  # Separate groups per worker so an edge push doesn't cancel a license
  # push that happens to be in flight.
  group: "deploy-workers-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  edge-worker:
    name: Deploy jsonexport-edge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy edge worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          wranglerVersion: "4.73.0"
          # TELEMETRY_TOKEN comes from the repo secret (never committed) so it
          # can rotate without touching code. Must match the site's
          # NEXT_PUBLIC_TELEMETRY_TOKEN at build time (deploy.yml).
          command: deploy --config wrangler-edge.toml --var TELEMETRY_TOKEN:${{ secrets.NEXT_PUBLIC_TELEMETRY_TOKEN }}

  license-worker:
    name: Deploy jsonexport-license + apply schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Schema via inline --command (NOT --file).
      # The D1 /import endpoint (used by --file) returns a false
      # "database not found" (7404) on fresh databases for weeks after
      # creation; --command hits /query which is stable.
      # Using `run:` block instead of wrangler-action's `command` input
      # because the latter folds YAML strings and strips the quotes
      # around the SQL arg, so wrangler saw "--command CREATE" (one word)
      # instead of the full statement string.
      - name: Apply D1 schema (idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Token has access to both user accounts. Explicit ACCOUNT_ID
          # makes wrangler target Theregalstarlite's (where DB lives)
          # even if the --config isn't fully honored by every command.
          CLOUDFLARE_ACCOUNT_ID: ea158eac6035716195ee97831b85562c
        working-directory: worker
        run: |
          npx -y wrangler@4.73.0 d1 execute jsonexport-license-db \
            --config wrangler-license.toml \
            --remote \
            --command "CREATE TABLE IF NOT EXISTS license_activations (license_key TEXT NOT NULL, device_id TEXT NOT NULL, activated_at INTEGER NOT NULL, revoked_at INTEGER, country TEXT, user_agent TEXT, email TEXT, PRIMARY KEY (license_key, device_id)); CREATE INDEX IF NOT EXISTS idx_license_active ON license_activations (license_key) WHERE revoked_at IS NULL; CREATE INDEX IF NOT EXISTS idx_license_email ON license_activations (email) WHERE email IS NOT NULL;"

      - name: Deploy license worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          wranglerVersion: "4.73.0"
          command: deploy --config wrangler-license.toml

  telemetry-worker:
    name: Deploy jsonexport-telemetry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy telemetry worker
        uses: cloudflare/wrangler-action@v3
        env:
          # Account ID via secret (not plaintext): identifiers aren't
          # credentials, but there is no reason to publish them either.
          # The token must cover this account (see header comment).
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_TELEMETRY_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          wranglerVersion: "4.73.0"
          command: deploy --config wrangler.toml
