name: Deploy Workers

# Deploys the Cloudflare Workers under worker/ on push to main. Matrix
# over each worker's wrangler config file so adding a new worker is one
# matrix entry plus one paths filter.
#
# Auth: CLOUDFLARE_API_TOKEN secret (scoped Workers Scripts/Routes Edit
# on the Theregalstarlite account + jsonexport.com zone + D1 edit).

on:
  push:
    branches: ["main"]
    paths:
      - "worker/edge-worker.ts"
      - "worker/wrangler-edge.toml"
      - "worker/license-worker.ts"
      - "worker/wrangler-license.toml"
      - "worker/license-schema.sql"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  # Separate groups per worker so an edge push doesn't cancel a license
  # push that happens to be in flight.
  group: "deploy-workers-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  edge-worker:
    name: Deploy jsonexport-edge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy edge worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          wranglerVersion: "4.73.0"
          command: deploy --config wrangler-edge.toml

  license-worker:
    name: Deploy jsonexport-license + apply schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Schema via inline --command instead of --file:
      # The --file path hits the D1 /import endpoint which returns a false
      # "database not found" (7404) on fresh databases for weeks.
      # https://github.com/cloudflare/workers-sdk/issues (recurring)
      # --command hits /query which is stable. Statements must be on one
      # line because wrangler splits on semicolons.
      - name: Apply D1 schema (idempotent)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          wranglerVersion: "4.73.0"
          command: >-
            d1 execute jsonexport-license-db --config wrangler-license.toml --remote --command
            "CREATE TABLE IF NOT EXISTS license_activations (license_key TEXT NOT NULL, device_id TEXT NOT NULL, activated_at INTEGER NOT NULL, revoked_at INTEGER, country TEXT, user_agent TEXT, email TEXT, PRIMARY KEY (license_key, device_id)); CREATE INDEX IF NOT EXISTS idx_license_active ON license_activations (license_key) WHERE revoked_at IS NULL; CREATE INDEX IF NOT EXISTS idx_license_email ON license_activations (email) WHERE email IS NOT NULL;"

      - name: Deploy license worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          wranglerVersion: "4.73.0"
          command: deploy --config wrangler-license.toml
