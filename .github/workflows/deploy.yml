name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-
      - name: Install dependencies
        run: npm ci
      - name: Build with Next.js
        env:
          NEXT_PUBLIC_CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.NEXT_PUBLIC_CLOUDFLARE_ANALYTICS_TOKEN }}
          # Telemetry endpoint + first-party path token come from repo secrets
          # (never hardcoded — Oct 2026: a hardcoded default made every clone
          # phone production telemetry). Both must be set or the build fails
          # fast below instead of shipping a blind client.
          NEXT_PUBLIC_TELEMETRY_URL: ${{ secrets.NEXT_PUBLIC_TELEMETRY_URL }}
          # Must match TELEMETRY_TOKEN passed to the edge worker at deploy
          # (deploy-worker.yml). Rotate by updating the secret + redeploying
          # both; stale cached clients degrade to the legacy endpoint.
          NEXT_PUBLIC_TELEMETRY_TOKEN: ${{ secrets.NEXT_PUBLIC_TELEMETRY_TOKEN }}
        run: |
          if [ -z "$NEXT_PUBLIC_TELEMETRY_URL" ] || [ -z "$NEXT_PUBLIC_TELEMETRY_TOKEN" ]; then
            echo "::error::Telemetry secrets NEXT_PUBLIC_TELEMETRY_URL / NEXT_PUBLIC_TELEMETRY_TOKEN are not set (repo Settings → Secrets → Actions)."
            exit 1
          fi
          npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
